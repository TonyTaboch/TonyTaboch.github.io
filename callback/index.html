<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Tesla Wrist Control – sign-in</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#05070D; color:#fff;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { max-width: 420px; margin: 16px; padding: 24px; border-radius: 20px; background:#0B101A;
          border:1px solid rgba(22,139,255,.5); box-shadow: 0 0 24px rgba(22,139,255,.25); text-align:center; }
  a.btn { display:inline-block; margin-top:16px; padding:12px 20px; border-radius:14px; color:#fff; text-decoration:none;
          border:1px solid #168BFF; background:rgba(22,139,255,.15); }
  p { color:#A7B0C0; }
</style>
</head>
<body>
<div class="card">
  <h2>Tesla Wrist Control</h2>
  <p id="msg">מעביר חזרה לאפליקציה…<br>Returning to the app…</p>
  <a class="btn" id="open" href="#">פתח את האפליקציה · Open the app</a>
</div>
<script>
  // Forwards Tesla's OAuth redirect (?code=…&state=…) to the Android app.
  // Nothing is stored or sent anywhere: the code goes straight to the app via the custom scheme,
  // and the app verifies `state` + PKCE before exchanging it.
  (function () {
    var target = "teslawristcontrol://oauth" + window.location.search;
    document.getElementById("open").href = target;
    window.location.replace(target);
    // Remove the code from the address bar/history of this page.
    try { history.replaceState(null, "", window.location.pathname); } catch (e) {}
  })();
</script>
</body>
</html>
